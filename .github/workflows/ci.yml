name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. This workflow only reads the code; it never needs to write
# to the repo, and a token that cannot write cannot be used to push malicious
# commits if a dependency in the build is ever compromised.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build-time placeholders. Next inlines NEXT_PUBLIC_* at build, so the
      # build needs *a* value — these are obviously fake and grant nothing.
      # Real credentials must never be added to this workflow: everything here
      # runs on pull requests, including from forks.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fails the build on a known-vulnerable dependency. Kept last so a
      # newly-published advisory reports as an audit failure rather than
      # masking a real code problem.
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Second line of defence behind GitHub's own push protection: catches a
      # credential committed in any historical commit, not just the pushed one.
      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
