version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Security patches arrive regardless of this grouping; the grouping only
    # keeps routine version bumps from opening a dozen separate PRs.
    groups:
      production:
        dependency-type: production
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: scope

  # Keep the Actions themselves current — a stale third-party action is a
  # supply-chain risk in its own right.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
